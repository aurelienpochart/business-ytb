name: Médias (Wikimedia Commons)

# Recherche d'images libres (media-queries.json) ou récupération des images choisies (media.json).
on:
  push:
    paths:
      - videos/*/media-queries.json
      - videos/*/media.json
  workflow_dispatch:
    inputs:
      mode:
        description: search ou fetch
        default: search
      video:
        default: videos/01-tesla

permissions:
  contents: write

concurrency:
  group: media-${{ github.ref }}

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Rechercher ou récupérer
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 pipeline/media.py "${{ inputs.mode }}" "${{ inputs.video }}"
          else
            for f in $(git diff --name-only HEAD~1 HEAD -- 'videos/*/media-queries.json'); do python3 pipeline/media.py search "$(dirname "$f")"; done
            for f in $(git diff --name-only HEAD~1 HEAD -- 'videos/*/media.json'); do python3 pipeline/media.py fetch "$(dirname "$f")"; done
          fi

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos
          git diff --cached --quiet || git commit -m "Médias : images Wikimedia Commons"
          git pull --rebase -q
          git push
