name: Test des voix

on:
  workflow_dispatch:
  push:
    paths:
      - config/voice-test.json
      - content/voice-test/**
      - pipeline/voice_test.py
      - .github/workflows/voice-test.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: voice-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/22144321243/locations/global/workloadIdentityPools/github/providers/business-ytb
          service_account: pipeline@business-ytb.iam.gserviceaccount.com
          token_format: access_token

      - name: Générer les échantillons
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 pipeline/voice_test.py config/voice-test.json

      - uses: actions/upload-artifact@v4
        with:
          name: echantillons-voix
          path: samples/voix/

      - name: Enregistrer les échantillons dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/voix
          git diff --cached --quiet || git commit -m "Échantillons de voix (test d'écoute)"
          git push
