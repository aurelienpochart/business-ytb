name: Envoyer sur YouTube (privé, programmé)

on:
  workflow_dispatch:
    inputs:
      video:
        description: Dossier de la vidéo
        default: videos/01-tesla
      run_id:
        description: Numéro du run « Produire une vidéo » dont on envoie le rendu
        required: true
      publish_at:
        description: "Date de sortie : auto (charte), none (privé sans date) ou date UTC (2026-11-10T15:00:00Z)"
        default: auto

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEO: ${{ inputs.video }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: video-finale
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: rendu

      - name: Description (charte 5.5)
        run: python3 pipeline/description.py "$VIDEO"

      - name: Envoi en privé, miniature, sous-titres
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: python3 pipeline/upload_youtube.py "$VIDEO" rendu/video.mp4 "$VIDEO/build/thumbnail.png"

      - name: Enregistrer l'identifiant YouTube
        run: |
          pipeline/commit_upload.sh "$VIDEO" long "YouTube : $VIDEO envoyée en privé"
