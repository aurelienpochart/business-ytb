name: Envoyer un Short sur YouTube (privé, programmé)

# Envoi en PRIVÉ programmé (publishAt, pipeline/schedule.py) ; le lien « vidéo associée » se règle dans
# YouTube Studio (absent de l'API).
on:
  workflow_dispatch:
    inputs:
      short:
        description: Dossier du Short
        default: videos/01-tesla/shorts/1
      run_id:
        description: Run « Produire un Short » (seulement si build/short.mp4 n'est pas dans le dépôt)
        required: false
      publish_at:
        description: "Date de sortie : auto (charte), none (privé sans date) ou date UTC (2026-11-10T15:00:00Z)"
        default: auto

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHORT: ${{ inputs.short }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: short-final
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: rendu

      - name: Envoi en privé et sous-titres
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          MP4=$(find rendu -name short.mp4 2>/dev/null | head -1)
          [ -n "$MP4" ] || MP4="$SHORT/build/short.mp4"
          test -f "$MP4"
          python3 pipeline/upload_short.py "$SHORT" "$MP4"

      - name: Enregistrer l'identifiant YouTube
        run: |
          pipeline/commit_upload.sh "$SHORT" short "YouTube : Short $SHORT envoyé en privé"
