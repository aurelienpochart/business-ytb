name: Récupérer des sources

on:
  push:
    paths:
      - research/*/sources.txt

permissions:
  contents: write

concurrency:
  group: fetch-sources-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Télécharger les listes modifiées
        run: |
          status=0
          for f in $(git diff --name-only HEAD~1 HEAD -- 'research/*/sources.txt'); do
            python3 pipeline/fetch_sources.py "$f" || status=1
          done
          exit 0

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git diff --cached --quiet || git commit -m "Sources téléchargées pour la recherche"
          git push
