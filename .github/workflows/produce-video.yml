name: Produire une vidéo

# Voix -> rendu Remotion en 1440p découpé en tranches parallèles -> assemblage, sous-titres, miniature.
on:
  workflow_dispatch:
    inputs:
      video:
        description: Dossier de la vidéo
        default: videos/01-tesla

permissions:
  contents: write
  id-token: write

concurrency:
  group: produce-${{ inputs.video }}
  cancel-in-progress: true

env:
  VIDEO: ${{ inputs.video }}
  SCALE: "1.3333333333333333" # 1920x1080 -> 2560x1440 (YouTube diffuse mieux les vidéos envoyées en 1440p)
  SHARDS: 6

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      frames: ${{ steps.frames.outputs.frames }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/22144321243/locations/global/workloadIdentityPools/github/providers/business-ytb
          service_account: pipeline@business-ytb.iam.gserviceaccount.com
          token_format: access_token

      - name: Installer ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)

      - name: Narration (voix Chirp 3 HD, -14 LUFS)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 pipeline/narration.py "$VIDEO"
          python3 pipeline/synthesize.py "$VIDEO"

      - id: frames
        name: Nombre d'images
        run: |
          python3 -c "import json,math;t=json.load(open('$VIDEO/build/timeline.json'));print('frames=%d'%math.ceil((t['duration']+20)*30))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Préparer Remotion
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund
          bash ../pipeline/remotion_public.sh "../$VIDEO"
          npx remotion browser ensure

      - name: Bande son complète (voix + effets)
        working-directory: remotion
        env:
          AUDIO_ONLY: "1"
        run: npx remotion render Video out/audio.wav --codec=wav --log=info

      - name: Miniature
        working-directory: remotion
        run: npx remotion still Thumbnail out/thumbnail.png --scale=1

      - uses: actions/upload-artifact@v4
        with:
          name: prepare
          path: |
            ${{ inputs.video }}/build/timeline.json
            ${{ inputs.video }}/build/captions.srt
            ${{ inputs.video }}/build/narration.wav
            remotion/out/audio.wav
            remotion/out/thumbnail.png
          retention-days: 3

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prepare
          path: .

      - name: Préparer Remotion
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund
          bash ../pipeline/remotion_public.sh "../$VIDEO"
          npx remotion browser ensure

      - name: Rendre la tranche ${{ matrix.shard }} (1440p, qualité maximale)
        working-directory: remotion
        run: |
          total=${{ needs.prepare.outputs.frames }}
          per=$(( (total + SHARDS - 1) / SHARDS ))
          start=$(( ${{ matrix.shard }} * per ))
          end=$(( start + per - 1 ))
          [ $end -ge $total ] && end=$(( total - 1 ))
          echo "images $start-$end sur $total"
          npx remotion render Video out/part-${{ matrix.shard }}.mp4 --frames=$start-$end --scale=$SCALE --muted --log=info

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: remotion/out/part-${{ matrix.shard }}.mp4
          retention-days: 3

  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Installer ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)

      - name: Assembler (vidéo sans réencodage + son AAC 320 kb/s)
        run: |
          mkdir -p out
          for i in $(seq 0 $((SHARDS - 1))); do echo "file '$PWD/dl/part-$i/part-$i.mp4'"; done > parts.txt
          ffmpeg -loglevel error -y -f concat -safe 0 -i parts.txt -i dl/prepare/remotion/out/audio.wav \
            -map 0:v -map 1:a -c:v copy -c:a aac -b:a 320k -ar 48000 -movflags +faststart -shortest out/video.mp4
          cp dl/prepare/remotion/out/thumbnail.png out/thumbnail.png
          cp dl/prepare/$VIDEO/build/captions.srt out/captions.srt
          ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,width,height -of compact out/video.mp4

      - name: Aperçu léger pour la relecture
        run: |
          mkdir -p "$VIDEO/build"
          ffmpeg -loglevel error -y -i out/video.mp4 -vf scale=1280:-2 -c:v libx264 -crf 28 -preset slow -c:a aac -b:a 128k "$VIDEO/build/preview.mp4"
          cp out/thumbnail.png "$VIDEO/build/thumbnail.png"
          cp dl/prepare/$VIDEO/build/timeline.json dl/prepare/$VIDEO/build/captions.srt "$VIDEO/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: video-finale
          path: |
            out/video.mp4
            out/thumbnail.png
            out/captions.srt
          retention-days: 30

      - name: Enregistrer timeline, sous-titres, miniature et aperçu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VIDEO/build"
          git add -f "$VIDEO/build/preview.mp4"
          git diff --cached --quiet || git commit -m "Production : $VIDEO (timeline, sous-titres, miniature, aperçu)"
          git pull --rebase -q
          git push
